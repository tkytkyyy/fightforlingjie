<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1024">
<title>百炼英雄 · 灵姐争夺战</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(130% 70% at 50% -10%,#3a1f45 0%,#1b1024 55%,#120a1a 100%);
    color:#f4eef8;user-select:none;
  }
  .app{width:100%;max-width:440px;margin:0 auto;height:100dvh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);position:relative;z-index:2}
  .screen{display:none;flex:1 1 auto;flex-direction:column;min-height:0}
  .screen.on{display:flex;animation:sfade .3s ease both}
  @keyframes sfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  button{font-family:inherit;cursor:pointer;border:0}

  /* ---------- 通用 ---------- */
  .hd{flex:0 0 auto;text-align:center;position:relative;margin-bottom:10px}
  .kick{font-size:11px;font-weight:800;letter-spacing:7px;color:#ffb703;margin-bottom:2px;
    text-shadow:0 0 14px rgba(255,183,3,.55)}
  .tt{font-size:23px;font-weight:900;letter-spacing:3px;
    background:linear-gradient(92deg,#ffd166,#ff7ab8 50%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .st{margin-top:3px;font-size:11px;color:#a894c0;letter-spacing:2px}
  .pill{display:inline-block;font-size:10.5px;color:#ffd9ef;background:rgba(255,122,184,.16);
    border:1px solid rgba(255,122,184,.35);border-radius:999px;padding:3px 10px;letter-spacing:1px}
  .btn{width:100%;border-radius:16px;padding:14px 0;font-size:16px;font-weight:900;letter-spacing:4px;color:#fff;
    background:linear-gradient(135deg,#ff5f9e,#a855f7);box-shadow:0 10px 24px rgba(168,85,247,.4)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
  .btn:disabled{background:rgba(255,255,255,.08);color:#7d6f8c;box-shadow:none}

  /* ---------- 选角 ---------- */
  .grid{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;
    grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;padding-bottom:8px}
  .pc{position:relative;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);
    border:2px solid transparent;transition:transform .15s,border-color .15s}
  .pc:active{transform:scale(.94)}
  .pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#2a1b36}
  .pc b{display:block;font-size:11px;font-weight:700;text-align:center;padding:4px 2px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8dcf2}
  .pc.sel{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.25),0 8px 20px rgba(255,209,102,.3)}
  .pc.sel::after{content:"✓";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
    background:#ffd166;color:#3a1f45;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .detail{flex:0 0 auto;margin-top:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:11px 13px;min-height:86px}
  .dn{font-size:17px;font-weight:900;letter-spacing:1px}
  .dn span{font-size:11px;font-weight:600;color:#ffd166;margin-left:8px;letter-spacing:0}
  .dstat{margin-top:5px;font-size:11px;color:#b7a6c9;letter-spacing:.5px}
  .dstat i{font-style:normal;color:#ffd166}
  .dsk{margin-top:6px;font-size:11.5px;line-height:1.55;color:#d8cbe6}
  .dsk b{color:#ff9ecb}

  /* ---------- 赛程 ---------- */
  .roundtag{flex:0 0 auto;display:flex;gap:5px;justify-content:center;margin-bottom:9px;flex-wrap:wrap}
  .rt{font-size:10px;padding:3px 9px;border-radius:999px;color:#8b7a9e;background:rgba(255,255,255,.06);letter-spacing:1px}
  .rt.now{color:#3a1f45;background:linear-gradient(90deg,#ffd166,#ffb703);font-weight:900}
  .rt.done{color:#7dd3a0;background:rgba(125,211,160,.14)}
  .mlist{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:7px;padding-bottom:8px}
  .mrow{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    border-radius:14px;padding:7px 8px;opacity:.35;transition:opacity .3s}
  .mrow.live{opacity:1}
  .mrow.me{border-color:#ff7ab8;background:rgba(255,122,184,.12);opacity:1;box-shadow:0 0 0 2px rgba(255,122,184,.2)}
  .side{flex:1 1 0;display:flex;align-items:center;gap:5px;min-width:0}
  .side.r{justify-content:flex-end}
  .side img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:#2a1b36}
  .side span{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8dcf2}
  .side.lose{opacity:.35}
  .side.lose span{text-decoration:line-through}
  .side.win span{color:#ffd166}
  .mid{flex:0 0 auto;font-size:9.5px;font-weight:900;color:#8b7a9e;letter-spacing:1px;padding:0 2px}
  .mrow.me .mid{color:#ff7ab8}
  .res{flex:0 0 auto;font-size:10px;color:#9c8bb0;text-align:center;padding:0 4px;line-height:1.3;min-width:60px}
  .news{flex:0 0 auto;height:34px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:11.5px;color:#c9b8dc;margin-top:6px}
  .news.pop{animation:npop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes npop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}

  /* ---------- 战斗 ---------- */
  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#a894c0;letter-spacing:1px}
  .ljzone{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 4px}
  .ljav{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #ffd166;
    box-shadow:0 0 14px rgba(255,209,102,.5);flex:0 0 auto}
  .ljav.talk{animation:ljtalk .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes ljtalk{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-8deg)}100%{transform:scale(1)}}
  .ljb{flex:1 1 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;
    padding:7px 11px;font-size:11.5px;color:#ffe9f5;min-height:34px;display:flex;align-items:center}
  .ljb.hot{background:rgba(255,122,184,.24);border-color:rgba(255,122,184,.5);color:#fff}

  .fighter{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:9px 11px}
  .fighter.me{border-color:rgba(255,122,184,.55);background:rgba(255,122,184,.12)}
  .fav{width:62px;height:62px;border-radius:16px;object-fit:cover;flex:0 0 auto;background:#2a1b36}
  .finfo{flex:1 1 auto;min-width:0}
  .fnm{font-size:15px;font-weight:900;letter-spacing:1px}
  .fnm em{font-style:normal;font-size:10px;font-weight:600;color:#ffd166;margin-left:6px}
  .hpbar{margin-top:5px;height:9px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;position:relative}
  .hpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff5f9e,#ffb703);
    transition:width .35s cubic-bezier(.22,1,.36,1)}
  .hpbar b{position:absolute;right:0;top:-14px;font-size:10px;font-weight:700;color:#d9cbe6}
  .fskn{margin-top:4px;font-size:10px;color:#a894c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fighter.hurt{animation:fhurt .32s}
  @keyframes fhurt{0%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-1.5deg)}
    60%{transform:translateX(6px) rotate(1deg)}100%{transform:none}}
  .float{position:absolute;right:14px;top:6px;font-size:24px;font-weight:900;pointer-events:none;
    text-shadow:0 3px 8px rgba(0,0,0,.6);animation:flt .85s cubic-bezier(.2,.9,.3,1) forwards}
  .float.dmg{color:#ff5c7a}
  .float.dmg.crit{color:#ffd166;font-size:31px}
  .float.heal{color:#7dd3a0}
  .float.miss{color:#9db4ff;font-size:17px}
  @keyframes flt{0%{transform:translateY(6px) scale(.6);opacity:0}
    25%{transform:translateY(-6px) scale(1.15);opacity:1}
    100%{transform:translateY(-30px) scale(1);opacity:0}}

  .banner{flex:0 0 auto;height:30px;display:flex;align-items:center;justify-content:center;margin:7px 0}
  .banner span{font-size:12.5px;font-weight:900;letter-spacing:2px;color:#3a1f45;
    background:linear-gradient(90deg,#ffd166,#ffb703);border-radius:999px;padding:5px 16px;
    animation:bnr .6s cubic-bezier(.2,1.4,.35,1) both;box-shadow:0 6px 16px rgba(255,183,3,.4)}
  @keyframes bnr{0%{transform:scale(.5) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}

  .log{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:4px 0 8px;
    background:rgba(0,0,0,.28);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-height:0}
  .lg{font-size:11.5px;line-height:1.5;color:#c4b3d6;animation:lgin .28s ease both}
  .lg b{color:#fff}
  .lg .r{color:#ff8fa8}
  .lg .g{color:#7dd3a0}
  .lg .y{color:#ffd166}
  @keyframes lgin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

  /* ---------- 战斗场景 ---------- */
  .arena{flex:1 1 auto;min-height:212px;position:relative;overflow:hidden;border-radius:18px;margin:2px 0 6px;
    background:linear-gradient(180deg,#241533 0%,#3a2049 52%,#4b2a3c 100%)}
  .sky{position:absolute;inset:0;background:
    radial-gradient(60% 40% at 50% 6%,rgba(255,214,150,.22),transparent 70%),
    radial-gradient(90% 60% at 50% 110%,rgba(0,0,0,.55),transparent 60%)}
  .crowd{position:absolute;left:0;right:0;bottom:30%;height:16px;opacity:.5;
    background-image:radial-gradient(circle,rgba(0,0,0,.85) 46%,transparent 47%);background-size:15px 15px}
  .floor{position:absolute;left:0;right:0;bottom:0;height:32%;
    background:linear-gradient(180deg,rgba(255,190,120,.16),rgba(0,0,0,.5));
    border-top:1px solid rgba(255,255,255,.14)}
  .light{position:absolute;top:-30px;width:110px;height:125%;filter:blur(7px);
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
  .light.l1{left:4%;transform:rotate(16deg)}
  .light.l2{right:4%;transform:rotate(-16deg)}
  #arena.shake{animation:ashake .32s}
  @keyframes ashake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}
    40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}

  .hptop{position:absolute;top:0;left:0;right:0;padding:7px 8px;display:flex;flex-direction:column;gap:7px;z-index:5}
  .hpr{display:flex;align-items:center;gap:6px}
  .hpr.r{justify-content:flex-end}
  .hpic{width:26px;height:26px;border-radius:8px;object-fit:cover;border:1.5px solid rgba(255,255,255,.55);flex:0 0 auto;background:#2a1b36}
  .hpc{flex:1 1 auto;max-width:80%}
  .hn{display:flex;gap:5px;align-items:baseline;font-size:10.5px;font-weight:800;color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.7)}
  .hpr.r .hn{justify-content:flex-end}
  .hn em{font-style:normal;font-size:9px;font-weight:700;color:#ffd166}

  .unit{position:absolute;bottom:16px;width:88px;height:118px;z-index:4}
  .unit.u-l{left:5%} .unit.u-r{right:5%}
  .fig{position:absolute;inset:0;transform-origin:50% 100%;animation:bob 1.7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .head{position:absolute;left:22px;top:0;width:44px;height:44px;border-radius:50%;overflow:hidden;
    border:3px solid #fff;z-index:3;box-shadow:0 4px 10px rgba(0,0,0,.5);background:#2a1b36}
  .head img{width:100%;height:100%;object-fit:cover;display:block}
  .head.hit{animation:headHit .34s}
  @keyframes headHit{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.5)}
    30%{box-shadow:0 0 0 4px #ff3b5c,0 4px 16px rgba(255,0,60,.75)}}
  .torso{position:absolute;left:25px;top:42px;width:38px;height:42px;border-radius:13px 13px 9px 9px;z-index:2}
  .u-l .torso{background:linear-gradient(180deg,#ff9ecb,#c026d3)}
  .u-r .torso{background:linear-gradient(180deg,#9fb3c8,#334155)}
  .torso::after{content:"";position:absolute;left:50%;top:9px;width:13px;height:13px;margin-left:-6.5px;
    border-radius:50%;background:rgba(255,255,255,.32)}
  .arm{position:absolute;top:48px;width:11px;height:32px;border-radius:7px;z-index:1;transform-origin:50% 10%}
  .u-l .arm{background:linear-gradient(180deg,#ff8fc0,#a21caf)}
  .u-r .arm{background:linear-gradient(180deg,#8fa3b8,#1e293b)}
  .arm.al{left:14px;transform:rotate(16deg)}
  .arm.ar{right:14px;transform:rotate(-16deg)}
  .leg{position:absolute;top:80px;width:13px;height:32px;border-radius:6px;z-index:1}
  .u-l .leg{background:linear-gradient(180deg,#c026d3,#6b21a8)}
  .u-r .leg{background:linear-gradient(180deg,#334155,#0f172a)}
  .leg.ll{left:28px} .leg.lr{right:28px}
  .shadow{position:absolute;bottom:-5px;left:17px;width:54px;height:11px;border-radius:50%;
    background:rgba(0,0,0,.55);filter:blur(3px)}
  .aura{position:absolute;left:50%;top:52%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;
    opacity:0;pointer-events:none;z-index:0}
  .aura.on{animation:auraUp .9s ease-out}
  .aura.gold{background:radial-gradient(circle,rgba(255,209,102,.6),transparent 68%)}
  .aura.dark{background:radial-gradient(circle,rgba(15,23,42,.85),transparent 68%)}
  .aura.blue{background:radial-gradient(circle,rgba(96,165,250,.55),transparent 68%)}
  .aura.green{background:radial-gradient(circle,rgba(125,211,160,.55),transparent 68%)}
  @keyframes auraUp{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4)}}

  .fig.atkL{animation:atkL .46s ease-in-out}
  @keyframes atkL{0%{transform:translateX(0)}28%{transform:translateX(-9px) rotate(-4deg)}
    56%{transform:translateX(32px) rotate(7deg)}100%{transform:translateX(0)}}
  .fig.atkR{animation:atkR .46s ease-in-out}
  @keyframes atkR{0%{transform:translateX(0)}28%{transform:translateX(9px) rotate(4deg)}
    56%{transform:translateX(-32px) rotate(-7deg)}100%{transform:translateX(0)}}
  .fig.hurtL{animation:hurtL .4s}
  @keyframes hurtL{0%{transform:translateX(0)}28%{transform:translateX(-15px) rotate(-7deg)}
    64%{transform:translateX(7px)}100%{transform:none}}
  .fig.hurtR{animation:hurtR .4s}
  @keyframes hurtR{0%{transform:translateX(0)}28%{transform:translateX(15px) rotate(7deg)}
    64%{transform:translateX(-7px)}100%{transform:none}}
  .fig.cast{animation:castM .55s}
  @keyframes castM{0%{transform:scale(1)}40%{transform:scale(1.14) translateY(-7px)}100%{transform:scale(1)}}
  .fig.koL{animation:koL .95s forwards}
  @keyframes koL{to{transform:rotate(-78deg) translateY(18px);opacity:.32}}
  .fig.koR{animation:koR .95s forwards}
  @keyframes koR{to{transform:rotate(78deg) translateY(18px);opacity:.32}}

  .vfx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
  .pfx{position:absolute;font-size:22px;line-height:1;opacity:0;will-change:transform;
    transition:transform .52s cubic-bezier(.25,.8,.3,1),opacity .52s}
  .ring{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;opacity:0;
    transition:transform .46s ease-out,opacity .46s}
  .num{position:absolute;font-size:22px;font-weight:900;line-height:1;opacity:0;
    text-shadow:0 3px 8px rgba(0,0,0,.75);transition:transform .85s cubic-bezier(.2,.9,.3,1),opacity .85s}
  .num.dmg{color:#ff5c7a} .num.crit{color:#ffd166;font-size:30px} .num.heal{color:#7dd3a0}
  .slash{position:absolute;width:64px;height:7px;border-radius:4px;opacity:0;
    background:linear-gradient(90deg,transparent,#fff,transparent);transition:transform .3s,opacity .3s}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;
    transition:transform .44s cubic-bezier(.2,.9,.3,1),opacity .44s}
  .boom{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
    opacity:0;transition:transform .4s ease-out,opacity .4s}
  .banner{position:absolute;top:36%;left:0;right:0;z-index:8;height:auto;margin:0;justify-content:center}
  .log{height:84px;flex:0 0 auto}

  /* ---------- 结果 / 结局 ---------- */
  .rsbox{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  .rsim{width:110px;height:110px;border-radius:26px;object-fit:cover;border:3px solid #ffd166;
    box-shadow:0 12px 30px rgba(255,183,3,.4);animation:sway 2.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .rst{font-size:26px;font-weight:900;letter-spacing:2px}
  .rst.win{background:linear-gradient(92deg,#ffd166,#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rst.lose{color:#9c8bb0}
  .rsd{font-size:13px;color:#c4b3d6;line-height:1.7;max-width:290px}
  .rsextra{font-size:11.5px;color:#a894c0}
  .couple{display:flex;align-items:center;justify-content:center;gap:12px}
  .couple img{width:92px;height:92px;border-radius:24px;object-fit:cover;border:3px solid #fff;
    box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .couple img.a{animation:sway 2.4s ease-in-out infinite}
  .couple img.b{animation:sway 2.4s ease-in-out infinite .3s}
  .heart{font-size:26px;animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}}

  /* ---------- 特效 ---------- */
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
  #confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.9}}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.35;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
  @media (max-height:660px){
    .tt{font-size:20px}.fav{width:52px;height:52px}.ljav{width:40px;height:40px}
    .log{font-size:11px}.btn{padding:12px 0}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div id="confetti"></div>

<div class="app">

  <!-- ============ 选角 ============ -->
  <section class="screen on" id="s-select">
    <div class="hd">
      <div class="kick">百 炼 英 雄</div>
      <div class="tt">灵 姐 争 夺 战</div>
      <div class="st" id="selsub">16 位勇士 · 单败淘汰 · 胜者抱得美人归</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail"></div>
    <div style="flex:0 0 auto;margin-top:10px"><button class="btn" id="go" disabled>开 打</button></div>
  </section>

  <!-- ============ 赛程 ============ -->
  <section class="screen" id="s-bracket">
    <div class="hd">
      <div class="tt" id="brtitle">16 强</div>
      <div class="st" id="brsub">其他人已经打完了，轮到你</div>
    </div>
    <div class="roundtag" id="roundtag"></div>
    <div class="mlist" id="mlist"></div>
    <div class="news" id="news"></div>
    <div style="flex:0 0 auto;margin-top:8px"><button class="btn" id="fightbtn" disabled>等 待</button></div>
  </section>

  <!-- ============ 战斗 ============ -->
  <section class="screen" id="s-battle">

  /* ================= 工具 ================= */
  var $=function(s){return document.querySelector(s)};
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function rnd(){return Math.random();}
  function show(id){['s-select','s-bracket','s-battle','s-round','s-final'].forEach(function(x){
    document.getElementById(x).classList.toggle('on',x===id);});}
  function stars(n){var s='';for(var i=0;i<5;i++)s+= i<n?'★':'☆';return s;}

  /* ================= 战斗引擎 ================= */
  var S=1.15; // 血量/治疗放大系数，让对局撑得住 6~9 回合
  function mkSide(f,isP,boost){
    var b=isP?boost:null, hp=Math.round(f.hp*S);
    return {f:f,isP:!!isP,hp:hp,max:hp,
      atk:f.atk*(b?b.atkMul:1), crit:(b?b.crit:0), skP:(b?b.skP:1), ljB:(b?b.lj:0),
      halfDone:false, blind:0, weaken:0, buff:0, ljBuff:0, ljBt:0};
  }

  // 完整跑一场，返回 {winner, log:[...]}
  function runBattle(A,B){
    var a=mkSide(A,false,null), b=mkSide(B,false,null), log=[];
    var first = rnd()<0.5?0:1;
    for(var r=1;r<=40;r++){
      var order = first===0?[a,b]:[b,a];
      if(r>1) order = (rnd()<0.5)?[a,b]:[b,a];
      for(var k=0;k<2;k++){
        var at=order[k], df=order[1-k];
        if(at.hp<=0||df.hp<=0) continue;
        attack(at,df,log,r);
        if(df.hp<=0) break;
      }
      // 回合末治疗
      endTurn(a,log); endTurn(b,log);
      if(a.hp<=0||b.hp<=0) break;
    }
    var w = a.hp<=0 ? b : (b.hp<=0 ? a : (a.hp>=b.hp?a:b));
    log.push({t:'end',w:w.f.name});
    return {winner:w.f, log:log};
  }

  function endTurn(s,log){
    var sk=s.f.sk;
    if(sk.t==='turn'&&sk.e==='heal'&&rnd()<sk.p*s.skP){
      var v=Math.min(Math.round(sk.v*S), s.max-s.hp);
      if(v>0){ s.hp+=v; log.push({t:'heal',who:s.f.name,v:v,sk:sk.n}); }
    }
    if(sk.t==='turn'&&sk.e==='gamble'){
      if(rnd()<sk.p*s.skP){ s.buff=Math.max(s.buff, sk.v*100); log.push({t:'sk',who:s.f.name,sk:sk.n,txt:'运气爆棚，本回合战力 +'+Math.round(sk.v*100)+'%'}); }
      else { s.buff=-20; log.push({t:'sk',who:s.f.name,sk:sk.n,txt:'翻车了，本回合战力 -20%'}); }
    }
  }

  function attack(at,df,log,r){
    var sk=at.f.sk, mul=1, tag=null;

    // 摸鱼：跳过本回合
    if(sk.t==='ownTurn'&&sk.e==='skip'&&rnd()<sk.p*at.skP){
      var hv=Math.min(Math.round(sk.v*S),at.max-at.hp); if(hv>0) at.hp+=hv;
      log.push({t:'sk',who:at.f.name,sk:sk.n,txt:'原地摸鱼，回复 '+hv+' 点血'});
      return;
    }
    // 被致盲
    if(at.blind>0){ at.blind--; log.push({t:'miss',who:at.f.name,txt:at.f.name+' 眼前一黑，攻击落空'}); return; }

    // 技能：攻击倍率类
    if(sk.t==='first'&&r===1){ mul*=sk.v; tag=sk.n; }
    else if(sk.t==='lowHp'&&at.hp/at.max<sk.thr){ mul*=sk.v; tag=sk.n; }
    else if(sk.t==='chance'&&sk.e==='atkMul'&&rnd()<sk.p*at.skP){ mul*=sk.v; tag=sk.n; }

    // 被动：魅力压制
    if(sk.t==='passive'&&sk.e==='chaBonus'&&at.f.cha>df.f.cha){ mul*=(1+sk.v); }
    // 超赛变身
    if(sk.t==='halfOnce'&&!at.halfDone&&at.hp/at.max<(sk.thr||.5)){
      at.halfDone=true; at.atk*=(1+sk.v);
      log.push({t:'sk',who:at.f.name,sk:sk.n,txt:'头发炸起来了！战力永久 +'+Math.round(sk.v*100)+'%'});
    }
    // buff / weaken
    if(at.buff>0) mul*=(1+at.buff/100);
    if(at.ljBt>0){ mul*=(1+at.ljBuff/100); at.ljBt--; }
    if(at.weaken>0){ mul*=at.weaken; at.weaken=0; }

    var dmg = at.atk*mul*(0.78+rnd()*0.44);
    var crit = rnd() < (0.05 + at.f.luk/1200 + at.crit);
    if(crit) dmg*=1.8;

    // 防守方技能
    var dsk=df.f.sk, blocked=false, reflect=0;
    if(dsk.t==='onHurt'&&rnd()<dsk.p*df.skP){
      if(dsk.e==='dodge'){ blocked=true; log.push({t:'sk',who:df.f.name,sk:dsk.n,txt:'一动不动，硬是没打着'}); }
      else if(dsk.e==='reflect'){ blocked=true; reflect=Math.round(dmg*dsk.v); log.push({t:'sk',who:df.f.name,sk:dsk.n,txt:'分身替他挨了这一下，还弹回去 '+reflect}); }
    }
    if(dsk.t==='passive'&&dsk.e==='reduceDmg') dmg*=(1-dsk.v);
    dmg=Math.max(1,Math.round(dmg));

    if(blocked){ log.push({t:'block',who:df.f.name}); }
    else {
      df.hp-=dmg; if(df.hp<0) df.hp=0;
      log.push({t:'atk',who:at.f.name,to:df.f.name,dmg:dmg,crit:crit,sk:tag});
      if(reflect>0){ at.hp-=reflect; if(at.hp<0)at.hp=0; log.push({t:'atk',who:df.f.name,to:at.f.name,dmg:reflect,crit:false,sk:dsk.n}); }
    }

    // 吸血
    if(!blocked&&sk.t==='passive'&&sk.e==='lifesteal'){
      var ls=Math.min(Math.round(dmg*sk.v),at.max-at.hp);
      if(ls>0){ at.hp+=ls; log.push({t:'heal',who:at.f.name,v:ls,sk:sk.n}); }
    }
    // 致盲 / 削弱
    if(sk.t==='chance'&&sk.e==='blind'&&rnd()<sk.p*at.skP){ df.blind=1; log.push({t:'sk',who:at.f.name,sk:sk.n,txt:'藏进夜色，'+df.f.name+' 下一击要落空'}); }
    if(sk.t==='chance'&&sk.e==='weaken'&&rnd()<sk.p*at.skP){ df.weaken=sk.v; log.push({t:'sk',who:at.f.name,sk:sk.n,txt:'魅惑成功，'+df.f.name+' 下一击伤害减半'}); }
    // 连击
    if(!blocked&&sk.t==='chance'&&sk.e==='doubleHit'&&df.hp>0&&rnd()<sk.p*at.skP){
      var d2=Math.max(1,Math.round(at.atk*sk.v*(0.8+rnd()*0.4)));
      if(dsk.t==='passive'&&dsk.e==='reduceDmg') d2=Math.round(d2*(1-dsk.v));
      df.hp-=d2; if(df.hp<0)df.hp=0;
      log.push({t:'atk',who:at.f.name,to:df.f.name,dmg:d2,crit:false,sk:sk.n,extra:true});
    }
  }

  /* 灵姐干预 */
  function lingjie(a,b,isP){
    var ev=pick(['buff','heal','zap','cheer']);
    var wA=40+a.f.cha*0.6+a.ljB*120, wB=40+b.f.cha*0.6+b.ljB*120;
    var t = rnd()*(wA+wB) < wA ? a : b;
    var o = (t===a)?b:a;
    if(ev==='buff'){ t.ljBuff=35; t.ljBt=3; return {who:t.f.name,txt:'灵姐朝 '+t.f.name+' 笑了笑，接下来 3 回合战力 +35%',hot:true}; }
    if(ev==='heal'){ var v=Math.min(Math.round(22*S),t.max-t.hp); t.hp+=v; return {who:t.f.name,txt:'灵姐递了瓶水，'+t.f.name+' 回复 '+v+' 点血',hot:true}; }
    if(ev==='zap'){ t.hp-=Math.round(14*S); if(t.hp<1)t.hp=1; return {who:t.f.name,txt:'灵姐皱了下眉，'+t.f.name+' 心里一凉 -'+Math.round(14*S),hot:true}; }
    var v2=Math.min(Math.round(16*S),t.max-t.hp); t.hp+=v2;
    return {who:t.f.name,txt:'灵姐喊了声「'+pick(VERBS)+'！」，'+t.f.name+' 热血上涌 +'+v2,hot:true};
  }

  /* ================= 玩家战（带日志，逐条播放） ================= */
  function playerBattle(me,foe,boost){
    var a=mkSide(me,true,boost), b=mkSide(foe,false,null), log=[];
    var god = boost.atkMul>2, saved=false;
    var r=1;
    for(;r<=40;r++){
      // 灵姐干预
      var ljP = god?0.75:0.16;
      if(rnd()<ljP){
        var lj=lingjie(a,b,true);
        if(god && lj.who!==a.f.name){ lj=lingjie(a,a,true); }
        log.push({t:'lj',txt:lj.txt,hot:lj.hot});
      }
      var order = rnd()<0.5?[a,b]:[b,a];
      for(var k=0;k<2;k++){
        var at=order[k], df=order[1-k];
        if(at.hp<=0||df.hp<=0) continue;
        attack(at,df,log,r);
        // 保底：不许你输
        if(god&&!saved&&a.hp<=0){
          saved=true; a.hp=Math.round(a.max*0.55);
          log.push({t:'lj',txt:'灵姐：本宫不许你倒下！',hot:true});
        }
        if(df.hp<=0) break;
      }
      var before=[a.hp,b.hp];
      endTurn(a,log); endTurn(b,log);
      if(a.hp<=0||b.hp<=0) break;
    }
    var win = (b.hp<=0)||(a.hp>0&&a.hp>=b.hp);
    if(a.hp<=0) win=false;
    if(god&&!win){ win=true; log.push({t:'lj',txt:'灵姐：本宫说了算，这一场算你赢。',hot:true}); }
    log.push({t:'end',w: win? a.f.name : b.f.name});
    return {win:win, log:log, myHp:Math.max(0,a.hp), foeHp:Math.max(0,b.hp)};
  }

    if(!cfg) return;
    castAnim(aside);
    if(cfg.k==='self'||cfg.k==='on') shieldFx(cfg.k==='on'?(dside||aside):aside, cfg.c);
    if(sk==='超赛变身'){ var au=document.getElementById(aside==='me'?'auraMe':'auraFoe'); au.className='aura gold on'; }
    if(sk==='夜色掩护'){ var au2=document.getElementById((dside||aside)==='me'?'auraMe':'auraFoe'); au2.className='aura dark on'; }
    if(sk==='影分身之术'){ var au3=document.getElementById(aside==='me'?'auraMe':'auraFoe'); au3.className='aura blue on'; }
    if(sk==='炼丹回血'||sk==='怀旧滤镜'){ var au4=document.getElementById(aside==='me'?'auraMe':'auraFoe'); au4.className='aura green on'; }
    burst(cfg,aside,dside||aside);
  }
  function setHp(who,hp,max){
    $('#'+who+'hp').style.width=Math.max(0,hp/max*100)+'%';
    $('#'+who+'hpt').textContent=Math.max(0,Math.round(hp));
  }
  function applyLog(e,foe){
    var isMe = function(n){ return n===myPick.name; };
    if(e.t==='lj'){
      var b=$('#ljb'); b.textContent=e.txt; b.classList.toggle('hot',!!e.hot);
      var im=$('#ljav'); im.classList.remove('talk'); void im.offsetWidth; im.classList.add('talk');
      push('<span class="y">👑 灵姐：</span>'+e.txt);
      return;
    }
    if(e.t==='end'){
      koAnim(e.w===myPick.name ? 'Foe' : 'Me');
      return;
    }
    if(e.t==='sk'){
      banner(e.sk+'　'+e.txt);
      vfxCast(e.sk, isMe(e.who)?'me':'foe', isMe(e.who)?'foe':'me');
      push('<b>'+e.who+'</b> 触发 <span class="y">「'+e.sk+'」</span> '+e.txt);
      return;
    }
    if(e.t==='miss'){
      anim(isMe(e.who)?'me':'foe','atk');
      push('<b>'+e.who+'</b> 攻击落空了');
      return;
    }
    if(e.t==='block'){
      var bs=isMe(e.who)?'me':'foe';
      shieldFx(bs,'#a78bfa');
      push('<b>'+e.who+'</b> 挡了下来');
      return;
    }
    if(e.t==='heal'){
      var m=isMe(e.who), w=m?'m':'t', hs=m?'me':'foe';
      var cur=parseFloat($('#'+w+'hp').style.width)/100, mx=m?MMAX:FMAX;
      setHp(w, cur*mx+e.v, mx);
      popNum(hs,'+'+e.v,'heal');
      burst({e:'💚',c:'#7dd3a0',k:'self',n:4}, hs, hs);
      push('<b>'+e.who+'</b> 回复 <span class="g">'+e.v+'</span> 点血');
      return;
    }
    if(e.t==='atk'){
      var vm=isMe(e.to), w2=vm?'m':'t', mx2=vm?MMAX:FMAX;
      var cur2=parseFloat($('#'+w2+'hp').style.width)/100*mx2;
      setHp(w2, Math.max(0,cur2-e.dmg), mx2);
      var aside=isMe(e.who)?'me':'foe', dside=vm?'me':'foe';
      anim(aside,'atk'); anim(dside,'hurt'); headHit(dside);
      if(e.sk) vfxCast(e.sk, aside, dside);
      else normalAtk(aside, dside, e.who, e.crit);
      popNum(dside,'-'+e.dmg, e.crit?'crit':'dmg');
      if(e.crit) shake();
      push('<b>'+e.who+'</b> → '+e.to+' <span class="r'+(e.crit?' y':'')+'">'+e.dmg+(e.crit?' 暴击!':'')+'</span>'+(e.sk?'　<span class="y">['+e.sk+']</span>':''));
      return;
    }
  }
  function push(html){
    var d=document.createElement('div'); d.className='lg'; d.innerHTML=html;
    logsEl.appendChild(d); logsEl.scrollTop=logsEl.scrollHeight;
    while(logsEl.children.length>40) logsEl.removeChild(logsEl.firstChild);
  }
  function finishBattle(res,foe){
    var win=res.win;
    var stage=stageName();
    if(!win){
      attempt++;
      show('s-round');
      $('#rsim').src=foe.file;
      $('#rst').className='rst lose'; $('#rst').textContent='你 输 了';
      $('#rsd').innerHTML='<b>'+foe.name+'</b> 击败了你，止步 <b>'+stage+'</b>。';
      $('#rsextra').innerHTML = attempt>=3
        ? '<span style="color:#ffd166">灵姐：最后一次了，本宫会帮你。</span>'
        : '还剩 '+(3-attempt+1)+' 次机会 · 灵姐在等你';
      $('#rbtn').textContent = '再 来 一 次';
      $('#rbtn').onclick=function(){ show('s-select'); renderSelect(); };
      return;
    }
    // 晋级
    var isChamp = (matches.length===1);
    show('s-round');
    $('#rsim').src=myPick.file;
    $('#rst').className='rst win';
    $('#rst').textContent = isChamp? '夺 冠 !' : '晋 级 !';
    $('#rsd').innerHTML = isChamp
      ? '你击败了 <b>'+foe.name+'</b>，全场只剩你一个人站着。'
      : '你击败了 <b>'+foe.name+'</b>，进入下一轮。';
    $('#rsextra').textContent = isChamp? '' : '剩余 '+matches.length+' 人 → 下一轮 '+(matches.length/2)+' 人';
    $('#rbtn').textContent = isChamp? '去 见 灵 姐' : '继 续';
    $('#rbtn').onclick=function(){
      if(isChamp){ finale(); return; }
      field=[];
      for(var i=0;i<matches.length;i++) field.push(matches[i].winner);
      round++; nextRound();
    };
  }
  function finale(){
    show('s-final');
    confetti();
    $('#fa').src=myPick.file;
    $('#ftitle').textContent=myPick.name+' 抱得灵姐归';
    $('#fdesc').innerHTML='四轮血战，'+myPick.name+'笑到了最后。<br>灵姐伸出手：「走吧。」';
    $('#fextra').textContent='第 '+attempt+' 次挑战 · 用了「'+myPick.sk.n+'」';
    $('#fbtn').onclick=function(){ attempt=1; myPick=null; show('s-select'); renderSelect(); };
  }

  function confetti(){
    var box=$('#confetti'), cs=['#ffd166','#ff7ab8','#a78bfa','#7dd3a0','#ff5f9e','#fff'];
    for(var i=0;i<80;i++){
      var s=document.createElement('i');
      s.style.left=(rnd()*100)+'%'; s.style.background=cs[i%cs.length];
      s.style.animationDuration=(1.4+rnd()*1.5)+'s'; s.style.animationDelay=(rnd()*.5)+'s';
      box.appendChild(s);
    }
    setTimeout(function(){box.innerHTML='';},3600);
  }
  function starBg(){
    var box=$('#stars');
    for(var i=0;i<50;i++){
      var s=document.createElement('span');
      s.style.left=(rnd()*100)+'%'; s.style.top=(rnd()*100)+'%';
      s.style.animationDelay=(-rnd()*3)+'s';
      box.appendChild(s);
    }
  }

  $('#go').addEventListener('click',function(){ show('s-bracket'); startTournament(); });
  $('#fightbtn').addEventListener('click',function(){ playBattle(); });

  if(typeof window!=='undefined'){ window.__FFL={runBattle:runBattle,playerBattle:playerBattle,F:F,BOOST:BOOST}; }
  starBg();
  renderSelect();
})();
</script>
</body>
</html>
